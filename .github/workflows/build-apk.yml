name: Build & Release OmniLink Remote APK

on:
  push:
      branches: [ "**" ]
        workflow_dispatch:

        permissions:
          contents: write

          jobs:
            build:
                name: Build Android APK
                    runs-on: ubuntu-latest

                        steps:
                              - name: Checkout Code
                                      uses: actions/checkout@v4

                                            - name: Set up Java 17
                                                    uses: actions/setup-java@v4
                                                            with:
                                                                      distribution: 'temurin'
                                                                                java-version: '17'

                                                                                      - name: Setup Android SDK
                                                                                              uses: android-actions/setup-android@v3

                                                                                                    - name: Make Gradle executable
                                                                                                            run: |
                                                                                                                      cd android
                                                                                                                                chmod +x gradlew
                                                                                                                                
                                                                                                                                      - name: Build Debug APK
                                                                                                                                              run: |
                                                                                                                                                        cd android
                                                                                                                                                                  ./gradlew assembleDebug --stacktrace
                                                                                                                                                                  
                                                                                                                                                                        - name: Locate Generated APK
                                                                                                                                                                                id: find_apk
                                                                                                                                                                                        run: |
                                                                                                                                                                                                  APK_PATH=$(find android/app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)
                                                                                                                                                                                                            echo "Found APK at: $APK_PATH"
                                                                                                                                                                                                                      echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
                                                                                                                                                                                                                      
                                                                                                                                                                                                                            - name: Upload APK as Workflow Artifact
                                                                                                                                                                                                                                    uses: actions/upload-artifact@v4
                                                                                                                                                                                                                                            with:
                                                                                                                                                                                                                                                      name: OmniLink-Remote-Debug-APK
                                                                                                                                                                                                                                                                path: ${{ steps.find_apk.outputs.apk_path }}
                                                                                                                                                                                                                                                                          retention-days: 30
                                                                                                                                                                                                                                                                          
                                                                                                                                                                                                                                                                                - name: Create GitHub Release with APK
                                                                                                                                                                                                                                                                                        uses: softprops/action-gh-release@v2
                                                                                                                                                                                                                                                                                                if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
                                                                                                                                                                                                                                                                                                        with:
                                                                                                                                                                                                                                                                                                                  tag_name: v1.0.${{ github.run_number }}
                                                                                                                                                                                                                                                                                                                            name: "OmniLink Remote v1.0.${{ github.run_number }} (APK Download)"
                                                                                                                                                                                                                                                                                                                                      body: |
                                                                                                                                                                                                                                                                                                                                                  ## 🚀 OmniLink Remote - Testing APK
                                                                                                                                                                                                                                                                                                                                                              Download the `app-debug.apk` directly on your Android phone and install it for testing.
                                                                                                                                                                                                                                                                                                                                                                        files: ${{ steps.find_apk.outputs.apk_path }}
                                                                                                                                                                                                                                                                                                                                                                                  draft: false
                                                                                                                                                                                                                                                                                                                                                                                            prerelease: false
                                                                                                                                                                                                                                                                                                                                                                                                    env:
                                                                                                                                                                                                                                                                                                                                                                                                              GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
